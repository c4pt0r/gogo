# Publishes the website (site/index.html and the book, built by make site
# with mdBook) to GitHub Pages: https://gogovm.dev/
#
# Runs on a push to main that changes the book, the landing page or the
# tools that build them, and by hand. Unlike the test workflow it does not
# run the test suite: make site-check (in make test) is where links are
# checked; this job only builds and deploys.
name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/book/**
      - site/**
      - tools/mdbooklinks/**
      - Makefile
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7 # x86_64-unknown-linux-gnu

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The book's preprocessor (tools/mdbooklinks) is a Go program.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: mdBook
        shell: bash
        run: |
          d="$RUNNER_TEMP/mdbook"
          mkdir -p "$d"
          curl -fsSL -o "$d/mdbook.tar.gz" "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "$MDBOOK_SHA256  $d/mdbook.tar.gz" | sha256sum -c -
          tar -xzf "$d/mdbook.tar.gz" -C "$d" mdbook
          echo "$d" >> "$GITHUB_PATH"
      - name: Build the site
        run: |
          make site
          go run ./tools/sitecheck build/site
          touch build/site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
          # site/.well-known/matrix delegates the gogovm.dev Matrix server
          # to matrix.gogovm.dev; dot directories are dropped otherwise.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
