# Release: on a tag v*, build the firmware for both boards and the gogo
# command for every OS and CPU with tools/release.sh, and attach them with
# SHA256SUMS to a draft GitHub release for the tag (a pre-release if the tag
# has a "-", e.g. v1.0.0-rc1). A maintainer checks the draft on both boards
# and publishes it (platform/esp32s3/README.md, "Releases"); until then
# `gogo setup` does not see it. It downloads the assets by name
# (cmd/gogo/setup_release.go).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-24.04
    # ESP-IDF v6.1.1, the version platform/esp32s3 is built with.
    container: espressif/idf:v6.1.1@sha256:2b4f966c37eaedc19542b0637a5f850b2eff9478d8e858192aa0073d92c2dc91
    strategy:
      matrix:
        board: [sticks3, cardputer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe gives the firmware its version
          persist-credentials: false
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          GOGO_RELEASE_WORK="$RUNNER_TEMP/work" tools/release.sh firmware "${{ matrix.board }}" out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.board }}
          path: out/
          if-no-files-found: error

  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Test
        run: go vet ./cmd/gogo && go test ./cmd/gogo
      - name: Build
        run: tools/release.sh cli "$GITHUB_REF_NAME" out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: out/
          if-no-files-found: error

  release:
    needs: [firmware, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: tools/release.sh sums out && cat out/SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --draft $pre \
            --title "gogo $GITHUB_REF_NAME" \
            --notes "Install: download gogo for your system, install esptool, run \`gogo setup\`. See docs/book/02-getting-started.md." \
            --verify-tag
